[package]
name = "android-core"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
# The published gpui-kit 0.6.2 depends on gpui-pre ^0.3.5, but gpui-mobile
# requires gpui-pre =0.3.6. This revision is the official example's
# known-good pairing (it is gpui-kit 0.6.2 + the gpui-pre 0.3.6 bump).
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "13c716b687b47f96a677aaf46c8fa341fa7208da", default-features = false, features = ["component"] }
gpui = { package = "gpui-pre", version = "=0.3.6", default-features = false }
log = "0.4"
# 真实 HTTP 客户端（修 "No HttpClient available"）
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.6" }
# 用内置 webpki 根证书的 reqwest（修 "UnknownIssuer"）
reqwest = { package = "gpui-pre-reqwest", version = "=0.12.15",
    default-features = false, features = ["rustls-tls-webpki-roots"] }