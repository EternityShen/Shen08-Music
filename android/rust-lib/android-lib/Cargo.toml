[package]
name = "android-lib"
version.workspace = true
edition.workspace = true

[lib]
name = "android_lib"
# cdylib => android_lib.so, loaded from Kotlin via System.loadLibrary("android_lib").
crate-type = ["cdylib"]

[dependencies]
android-core = { path = "../android-core" }
gpui-mobile = { git = "https://github.com/itsbalamurali/gpui-mobile", branch = "main" }
gpui = { package = "gpui-pre", version = "=0.3.6", default-features = false }
log = "0.4"
android_logger = "0.15"
jni = "0.22"
ndk = { version = "0.9", features = ["nativewindow"] }
ndk-sys = "0.6"
android-activity = { version = "0.6", features = ["native-activity"] }
